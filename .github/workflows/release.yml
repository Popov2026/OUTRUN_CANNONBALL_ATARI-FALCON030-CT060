# Builds the ready-to-run package from dist/ + res/ and publishes it as a GitHub release
# when a version tag (v*) is pushed. No ROMs and no .mod music are ever packaged.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: |
          set -e
          V="$GITHUB_REF_NAME"
          D=pkg/OUTRUN
          mkdir -p "$D/roms" "$D/Music"
          cp dist/CB030.TOS dist/CB060.TOS dist/outrun.ini dist/VERSION.txt outrun.ini.example "$D/"
          cp -r res "$D/res"
          cp dist/roms/README.txt dist/roms/roms.txt "$D/roms/"
          cp dist/Music/README.txt "$D/Music/"
          cp README.md README.fr.md docs/license.txt "$D/"
          # Safety net: refuse to publish any ROM or .mod file
          if find pkg -type f \( -iname '*.mod' -o -iname 'epr-*' -o -iname 'mpr-*' -o -iname 'opr-*' \) | grep .; then
            echo "ROM or .mod file found in the package, aborting"; exit 1
          fi
          (cd pkg && zip -r "../cannonball_falcon_${V}.zip" OUTRUN)
          unzip -l "cannonball_falcon_${V}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$GITHUB_REF_NAME"
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" "cannonball_falcon_${V}.zip" --clobber
          else
            gh release create "$V" "cannonball_falcon_${V}.zip" \
              --title "OutRun Cannonball Falcon ${V}" \
              --notes-file .github/release-notes.md
          fi

# Runs DMTEST.TOS (tools/dmtest.cpp) in Hatari on an emulated Falcon with DSP emulation:
# DSPMOD plays a synthetic 440 Hz module while the fx voices carry 1000 Hz (left) and
# 1500 Hz (right), like the game's sound. Hatari records the sound to a WAV file, which
# tools/analyse_wav.py checks. Results are pushed to the ci-results branch.
name: Hatari DSPMOD test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get update
          sudo apt-get install -y cross-mint-essential hatari xvfb xdotool imagemagick unzip
          pip install numpy

      - name: Build DMTEST
        run: |
          mkdir -p results
          m68k-atari-mint-gcc -mcpu=68030 -c src/main/atari/dspmod_asm.S -o dspmod_asm.o
          # compiled for the 030, linked against the 68000 libraries (no FPU), like the game
          for f in tools/dmtest.cpp src/main/atari/dspmod.cpp; do
            m68k-atari-mint-g++ -O2 -std=gnu++0x -mcpu=68030 -msoft-float -Isrc/main -DPLATFORM_ATARI -Wall -c $f -o $(basename $f .cpp).o
          done
          m68k-atari-mint-g++ -mcpu=68000 dmtest.o dspmod.o dspmod_asm.o -o DMTEST.TOS -lm
          python3 tools/make_test_mod.py TEST.MOD

      - name: Get EmuTOS
        run: |
          curl -fL -o emutos.zip https://github.com/emutos/emutos/releases/download/v1.3/emutos-512k-1.3.zip \
            || curl -fL -o emutos.zip "https://sourceforge.net/projects/emutos/files/emutos/1.3/emutos-512k-1.3.zip/download"
          unzip -o emutos.zip
          cp $(find . -name 'etos512us.img' | head -1) tos.img
          mkdir -p results && cp tos.img results/etos512us.img   # EmuTOS (GPL), for running Hatari elsewhere

      - name: Run DMTEST in Hatari
        timeout-minutes: 4
        run: |
          mkdir -p results hd/AUTO
          cp DMTEST.TOS hd/AUTO/DMTEST.PRG
          cp TEST.MOD hd/
          cp TEST.MOD hd/AUTO/      # a program started from AUTO\ may look for its files there
          cp DMTEST.TOS TEST.MOD results/
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99 SDL_AUDIODRIVER=dummy
          sleep 2
          hatari --confirm-quit false --machine falcon --dsp emu --memsize 14 --tos tos.img \
                 --harddrive hd --fast-boot true --sound 48000 --statusbar false --drive-led false \
                 --cmd-fifo cmdfifo > results/hatari.log 2>&1 &
          HP=$!
          for i in $(seq 1 20); do [ -p cmdfifo ] && break; sleep 1; done   # Hatari creates it
          ls -l cmdfifo || true
          exec 3<>cmdfifo   # read/write: does not wait for Hatari to open its end
          sleep 12
          echo "hatari-shortcut recsound" >&3
          sleep 14
          echo "hatari-shortcut recsound" >&3
          sleep 2
          import -window root results/screen.png || true
          sleep 8
          kill $HP || true
          ls -la . hd results
          cp hd/DMTEST.TXT results/ 2>/dev/null || true
          cp hd/AUTO/DMTEST.TXT results/DMTEST_AUTO.TXT 2>/dev/null || true
          WAV=$(ls -t *.wav 2>/dev/null | head -1)
          [ -n "$WAV" ] && cp "$WAV" results/dmtest.wav
          python3 tools/analyse_wav.py results/dmtest.wav > results/analysis.txt 2>&1; echo "exit=$?" >> results/analysis.txt
          cat results/analysis.txt results/DMTEST.TXT || true

      - name: Publish results to the ci-results branch
        if: always()
        timeout-minutes: 2
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp -r results /tmp/results
          git fetch origin ci-results || true
          git checkout --orphan ci-results-new
          git rm -rf -q . || true
          rm -rf ./* || true
          mkdir -p dspmod && cp -r /tmp/results/* dspmod/
          git add -A
          git commit -q -m "Hatari DSPMOD test results ($GITHUB_SHA)"
          git push -f origin ci-results-new:ci-results
